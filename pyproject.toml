[project]
name = "travel-concierge"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "strands-agents[otel]",
  "openinference-instrumentation-strands-agents",
  "bedrock-agentcore",
  "boto3",
  "mcp-proxy-for-aws>=1.7.0",
  "python-dotenv>=1.0",
]

[dependency-groups]
evals = ["strands-decider==0.1.0"]
dev = ["ruff"]

[tool.ruff]
line-length = 120
target-version = "py311"
